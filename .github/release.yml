# Configuration for GitHub's auto-generated release notes.
changelog:
  categories:
    - title: ✨ Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [bug, fix]
    - title: 🏗️ Refactors & internals
      labels: [refactor, chore, ci, build]
    - title: 📚 Documentation
      labels: [docs, documentation]
    - title: Other changes
      labels: ["*"]
